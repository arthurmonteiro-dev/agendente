# PostgreSQL para desenvolvimento local: docker compose up -d
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agendente
      POSTGRES_PASSWORD: agendente
      POSTGRES_DB: agendente
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
